name: Daily Data Update

on:
  schedule:
    - cron: '0 8 * * *'   # 北京时间 16:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate & Rebuild
        run: python3 rebuild.py
      - name: Commit & Push
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add index.html data.js data.json
          git diff --staged --quiet || git commit -m "🤖 Daily update $(date +%Y-%m-%d)"
          git push
